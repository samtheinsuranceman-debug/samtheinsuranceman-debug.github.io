<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Russell Capital Systems</title>
    <meta name="robots" content="noindex,follow" />
    <link rel="canonical" href="https://russellcap.com/" />
    <script>
      (() => {
        const destination = new URL("https://russellcap.com/");
        const path = window.location.pathname.replace(/^\/+/, "");
        destination.pathname = path ? `/${path}` : "/";
        destination.search = window.location.search;
        destination.hash = window.location.hash;
        window.location.replace(destination.toString());
      })();
    </script>
    <noscript>
      <meta http-equiv="refresh" content="0;url=https://russellcap.com/" />
    </noscript>
  </head>
  <body>
    <p>Opening Russell Capital Systems…</p>
    <p><a href="https://russellcap.com/">Continue to Russell Capital Systems</a></p>
  </body>
</html>
